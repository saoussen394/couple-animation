<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notre petit monde ❤️</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="scene">
    <div class="moon"></div>
    <div class="stars" aria-hidden="true"></div>

    <section class="message">
      <p class="eyebrow">JUSTE TOI & MOI</p>
      <h1>Notre petit monde <span>♥</span></h1>
      <p class="subtitle">Même sous les étoiles, je te choisirais encore.</p>
    </section>

    <div class="couple" aria-label="Deux personnages amoureux animés">
      <div class="person person-left">
        <div class="hair"></div>
        <div class="head"><span class="eye"></span><span class="cheek"></span></div>
        <div class="body"></div>
        <div class="arm arm-inner"></div>
        <div class="leg leg-left"></div><div class="leg leg-right"></div>
      </div>
      <div class="person person-right">
        <div class="hair"></div>
        <div class="head"><span class="eye"></span><span class="cheek"></span></div>
        <div class="body"></div>
        <div class="arm arm-inner"></div>
        <div class="leg leg-left"></div><div class="leg leg-right"></div>
      </div>
      <div class="kiss-heart">♥</div>
    </div>

    <div class="ground"></div>
    <button id="loveButton">Envoie un peu d’amour 💌</button>
    <p class="footer">Fait avec amour <span>♥</span></p>
  </main>
  <script src="script.js"></script>
</body>
</html>
